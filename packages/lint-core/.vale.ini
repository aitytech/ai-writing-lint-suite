; Vale configuration for this package's English style-guide checking (see
; packages/lint-core/src/vale.ts, which invokes the binary with an explicit
; --config pointing at THIS file, so neither the caller's cwd nor Vale's own
; upward .vale.ini search ever decides which config is used).
;
; StylesPath is resolved by Vale relative to this file's own directory, which is
; why the vendored styles live at packages/mcp-server/styles/ rather than
; alongside lint-core's source. Vale has no meaningful built-in style: an empty
; StylesPath yields literally zero findings (verified: `{}` JSON output), so the
; rules below ARE the check.
StylesPath = styles

; Report everything write-good can find and let this project's own severity
; mapping (vale.ts) decide what matters -- dropping suggestions here would
; silently discard the wordiness/cliche findings that are the entire reason
; Vale is wired in alongside Harper.
MinAlertLevel = suggestion

; Applies to every input regardless of the extension vale.ts associates with
; stdin (--ext=.md today). A more specific [*.md] section would silently
; check nothing if that ever changed.
[*]
BasedOnStyles = write-good

; E-Prime is vendored (styles/write-good/E-Prime.yml is complete and unmodified) but switched
; off, and it is the one rule in the set that has to be. "E-Prime" is a writing exercise --
; prose composed without any form of the verb "to be" -- not a style-guide rule; no style guide
; this checker is modelled on asks for it. In practice it fires on every copula: measured at 17
; of 25 findings (68%) on an ordinary 146-word draft, all of them "Try to avoid using 'is'".
; Left on, it would both bury the seven genuinely useful findings in that same draft and, on a
; long document, consume the MCP tool's MAX_FINDINGS cap with noise before the Harper
; grammar/spelling findings it is merged with ever got counted.
;
; Delete this line to turn it back on -- nothing else needs to change.
write-good.E-Prime = NO
