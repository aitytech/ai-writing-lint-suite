packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks git-hosted subdependencies by default (blockExoticSubdeps) as a supply-chain
# guard against an unaudited git dep sneaking in transitively. @aitytech/textlint-rule-preset-
# ai-writing-ja's own dependency on @aitytech/suzume (github:aitytech/suzume-wasm, our own
# fork, pinned by commit like everything else in this file) trips that guard as a
# subdependency even though it's fully AITYTECH-controlled, not third-party. Disabled here
# rather than left blocked, since the real protection (pinned commits + allowBuilds review
# below) already applies to it the same as every other git dep in this workspace.
blockExoticSubdeps: false

# The AITYTECH EN/VI presets ship TypeScript source only (no committed build output, by design —
# see their repos' "fix: stop committing lib/ build output" commits) and rely on a `prepare`
# script (`npm run build`) to compile on install. pnpm blocks git-dependency build scripts by
# default; explicitly allow these two, pinned to the exact commit hash in each package.json so
# this allowlist can't silently start trusting a different commit.
allowBuilds:
  "@aitytech/textlint-rule-preset-ai-writing-en@git+ssh://git@github.com/aitytech/textlint-rule-preset-ai-writing-en.git#b1a3c5b6a06c22af6aba604b2139391113188087": true
  "@aitytech/textlint-rule-preset-ai-writing-vi@git+ssh://git@github.com/aitytech/textlint-rule-preset-ai-writing-vi.git#bb0f17b2d6ac3b72e1fe283ab2a5aec5d1ce8632": true
  "@aitytech/textlint-rule-preset-ai-writing-ja@git+ssh://git@github.com/aitytech/textlint-rule-preset-ai-writing-ja.git#8f3937785760f0a46eb7c178a81442d7fc04791b": true
  # @aitytech/suzume-wasm: same pattern -- TS-only prepare script (tsc), the WASM binary
  # itself is committed prebuilt (see that repo's README for why).
  "@aitytech/suzume@https://codeload.github.com/aitytech/suzume-wasm/tar.gz/3304cb9ad51b21a835a292ab7efc405df15ae00b": true
  # Standard native-binary postinstall scripts needed by the RN/Metro toolchain (apps/mobile).
  # esbuild: well-known bundler binary. unrs-resolver: Rust-based module resolver (oxc
  # ecosystem), a transitive dependency of Metro tooling. Both widely used, not AITYTECH code.
  esbuild: true
  unrs-resolver: true
  # core-js-pure: polyfill lib pulled in transitively by the mobile/babel toolchain.
  # sharp: standard native image-processing lib (very widely used, not AITYTECH code).
  # workerd: Cloudflare's actual Workers runtime binary -- required for `wrangler dev`
  # to simulate the mcp-server package locally.
  core-js-pure: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.1'
  - zod@4.5.1
